<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
:root{--bg:#fff;--dot:#e4e4e9;--node:#fff;--ink:#1d1d1f;--mut:#86868b;--bd:rgba(0,0,0,.09);--line:#b0b0b6;--acc:#0071e3;--bar:rgba(255,255,255,.74);--hov:rgba(0,0,0,.06);--on:rgba(0,0,0,.09);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1c1e;--dot:#36363a;--node:#2c2c2e;--ink:#f5f5f7;--mut:#98989d;--bd:rgba(255,255,255,.13);--line:#6e6e73;--acc:#0a84ff;--bar:rgba(44,44,46,.76);--hov:rgba(255,255,255,.1);--on:rgba(255,255,255,.17);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c1c1e;--dot:#36363a;--node:#2c2c2e;--ink:#f5f5f7;--mut:#98989d;--bd:rgba(255,255,255,.13);--line:#6e6e73;--acc:#0a84ff;--bar:rgba(44,44,46,.76);--hov:rgba(255,255,255,.1);--on:rgba(255,255,255,.17);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
#stage{position:fixed;inset:0;background-image:radial-gradient(var(--dot) 1.2px,transparent 1.4px);background-size:24px 24px;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
#stage.pan{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#edges{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
.ed{fill:none;stroke-width:2.2;stroke-linecap:round}
.ed.on{stroke-width:4}
.eh{fill:none;stroke:transparent;stroke-width:16;pointer-events:stroke;cursor:pointer}
#tmp{fill:none;stroke:var(--acc);stroke-width:2;stroke-dasharray:5 5}
.node{position:absolute;box-sizing:border-box;background:var(--node);color:var(--ink);border:.5px solid var(--bd);border-radius:16px;box-shadow:0 1px 2px rgba(0,0,0,.05),0 6px 20px rgba(0,0,0,.08);cursor:default}
.node:not(.img){width:max-content;min-width:80px;max-width:300px;padding:10px 16px}
.node.img{padding:6px}
.node.sel{outline:2px solid var(--acc);outline-offset:2px}
.tx{outline:none;white-space:pre-wrap;word-break:break-word;min-height:1.4em}
.ed-on .tx,.tx[contenteditable=true]{cursor:text}
.imgw{position:relative;overflow:hidden;border-radius:7px;line-height:0}
.imgw img{width:100%;height:auto;display:block;pointer-events:none}
.ho,.hs{position:absolute;display:none}
.ho{right:-8px;top:50%;margin-top:-7px;width:14px;height:14px;border-radius:50%;background:var(--acc);border:2px solid var(--node);cursor:crosshair}
.hs{right:-6px;bottom:-6px;width:12px;height:12px;border-radius:3px;background:var(--node);border:2px solid var(--acc);cursor:nwse-resize}
.node:hover .ho,.node.sel .ho,.node.sel .hs{display:block}
.cropping .ho,.cropping .hs{display:none!important}
.cropbox{position:absolute;border:2px solid #fff;box-shadow:0 0 0 999px rgba(0,0,0,.5);cursor:move;box-sizing:border-box}
.cg{position:absolute;width:16px;height:16px;background:#fff;border:2px solid var(--acc);border-radius:4px;box-sizing:border-box}
.cg.nw{left:0;top:0;cursor:nwse-resize}.cg.ne{right:0;top:0;cursor:nesw-resize}.cg.sw{left:0;bottom:0;cursor:nesw-resize}.cg.se{right:0;bottom:0;cursor:nwse-resize}
.cg.n{left:50%;top:0;margin-left:-8px;cursor:ns-resize}.cg.s{left:50%;bottom:0;margin-left:-8px;cursor:ns-resize}.cg.w{top:50%;left:0;margin-top:-8px;cursor:ew-resize}.cg.e{top:50%;right:0;margin-top:-8px;cursor:ew-resize}
.pill{display:flex;align-items:center;gap:2px;padding:5px;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);border:.5px solid var(--bd);border-radius:999px;box-shadow:0 6px 24px rgba(0,0,0,.1),0 1px 3px rgba(0,0,0,.06)}
.pill button{display:grid;place-items:center;min-width:38px;height:38px;font:inherit;font-size:13px;font-weight:500;color:var(--ink);background:none;border:0;border-radius:19px;padding:0 10px;cursor:pointer;white-space:nowrap}
.pill svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.pill button:hover:not(:disabled){background:var(--hov)}
.pill button:disabled{opacity:.35;cursor:default}
.pill button:focus-visible,.sw:focus-visible{outline:2px solid var(--acc)}
.pill .sw{width:20px;height:20px;min-width:20px;padding:0;border-radius:50%;border:0;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.2);flex:none}
.pill .sep{width:1px;height:20px;background:var(--bd);flex:none;margin:0 4px}
.pill .pri{background:var(--acc);color:#fff}.pill .pri:hover:not(:disabled){background:var(--acc)}
#sws{gap:9px;padding:0 15px;height:48px}
#zr{min-width:58px}#zo,#zi{font-size:22px;font-weight:400}
#tb{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);display:flex;flex-wrap:wrap;justify-content:center;gap:10px;max-width:calc(100% - 20px)}
#cp{display:none;position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%)}
.cropping #cp{display:flex}.cropping #tb{display:none}
#zp{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px))}
#rp{position:fixed;right:16px;top:calc(14px + env(safe-area-inset-top,0px))}
@media (max-width:760px){#rp{top:auto;bottom:calc(16px + env(safe-area-inset-bottom,0px))}#hint{display:none}}
#hint{position:fixed;right:20px;bottom:calc(26px + env(safe-area-inset-bottom,0px));text-align:right;color:var(--mut);font-size:12.5px;pointer-events:none}
#toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.on{opacity:1}
.pill button.on{background:var(--on)}
#stage.sel-mode{cursor:default}
#mq{position:fixed;display:none;border:1px solid var(--acc);background:rgba(0,113,227,.08);border-radius:4px;pointer-events:none}
#lp{position:fixed;left:16px;top:calc(14px + env(safe-area-inset-top,0px))}
#nm{font:inherit;font-weight:600;font-size:15px;border:0;background:none;outline:none;color:var(--ink);width:150px;padding:0 12px 0 4px;height:38px;border-radius:12px}
#nm:focus{background:var(--hov)}
#home{display:none;position:fixed;inset:0;overflow:auto;background:var(--bg);padding:calc(48px + env(safe-area-inset-top,0px)) clamp(20px,6vw,72px) 60px}
.ishome #home{display:block}
.ishome #stage,.ishome #tb,.ishome #zp,.ishome #rp,.ishome #lp,.ishome #hint,.ishome #mq{display:none}
#home h1{font-size:34px;font-weight:700;letter-spacing:-.02em;margin:0 0 28px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:28px 22px}
.card{position:relative;font:inherit;color:var(--ink);background:none;border:0;padding:0;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.cv{aspect-ratio:4/3;background:#f5f5f7;border-radius:16px;overflow:hidden;display:grid;place-items:center;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.08);transition:box-shadow .15s;padding:12px;box-sizing:border-box}
.cv svg{width:100%;height:100%}
.card:hover .cv{box-shadow:inset 0 0 0 .5px rgba(0,0,0,.08),0 8px 24px rgba(0,0,0,.1)}
.card:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:16px}
.card b{font-size:14px;font-weight:600;margin-top:8px}
.card small{color:var(--mut);font-size:12.5px}
.card.new .cv span{font-size:48px;font-weight:200;color:var(--acc)}
.card .x{position:absolute;top:8px;right:8px;min-width:26px;height:26px;border:0;border-radius:13px;background:rgba(255,255,255,.92);box-shadow:0 1px 4px rgba(0,0,0,.18);font:inherit;font-size:15px;line-height:1;cursor:pointer;opacity:0;padding:0 8px;color:#1d1d1f}
.card:hover .x,.card:focus-within .x,.card .x.on{opacity:1}
.card .x.on{background:#ff3b30;color:#fff;font-size:12px}
@media (hover:none){.card .x{opacity:1}}
@media (max-width:760px){#tb{top:auto;bottom:calc(78px + env(safe-area-inset-bottom,0px))}#nm{width:110px}}
.node.sticky{width:176px;min-width:176px;min-height:176px;max-width:none;padding:16px 18px;border:0;border-radius:6px 6px 16px 6px;box-shadow:0 1px 1px rgba(0,0,0,.06),0 8px 18px rgba(0,0,0,.12)}
.node.sticky .tx{min-height:140px}
#gal{display:none;position:fixed;right:16px;top:calc(76px + env(safe-area-inset-top,0px));bottom:76px;width:min(264px,calc(100% - 32px));flex-direction:column;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);border:.5px solid var(--bd);border-radius:22px;box-shadow:0 8px 32px rgba(0,0,0,.12);overflow:hidden;z-index:5}
#gal.open{display:flex}.ishome #gal{display:none}
#gal header{display:flex;align-items:center;gap:8px;padding:14px 16px 8px;font-size:14px}
#gal header span{color:var(--mut);flex:1}
#gx{border:0;background:none;font-size:20px;line-height:1;color:var(--mut);cursor:pointer;border-radius:50%;width:28px;height:28px}
#gl{flex:1;overflow:auto;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px 12px 14px;align-content:start}
.gi{aspect-ratio:1;border:0;padding:0;border-radius:12px;overflow:hidden;cursor:pointer;background:var(--hov);box-shadow:inset 0 0 0 .5px var(--bd)}
.gi img{width:100%;height:100%;object-fit:cover;display:block}
.gi.on{outline:2px solid var(--acc);outline-offset:1px}
#ge{margin:0;padding:6px 18px 18px;color:var(--mut);font-size:13px;display:none}
#ink{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none;z-index:2}
#ink path{fill:none;stroke-linecap:round;stroke-linejoin:round}
#stage.ink-mode{cursor:crosshair}
#pw{display:none;position:fixed;left:50%;transform:translateX(-50%);top:calc(74px + env(safe-area-inset-top,0px))}
.pen #pw{display:flex}.ishome #pw{display:none}
#pw i{display:block;border-radius:50%;background:var(--ink)}
.pill .sw.on{box-shadow:inset 0 0 0 .5px rgba(0,0,0,.2),0 0 0 2px var(--node),0 0 0 3.5px var(--ink)}
.dk .sw[data-i="6"]{background:#f5f5f7!important}
.i-moon{display:block}.i-sun{display:none}.dk .i-moon{display:none}.dk .i-sun{display:block}
#ht{position:fixed;right:20px;top:calc(14px + env(safe-area-inset-top,0px))}

 ns.forEach(n=>{const q=box(n);a=Math.min(a,q.cx-q.w/2);b=Math.min(b,q.cy-q.h/2);c=Math.max(c,q.cx+q.w/2);d=Math.max(d,q.cy+q.h/2)});
 S.edges.forEach(g=>{const p=nodeOf(g.a),q=nodeOf(g.b);if(p&&q&&els.has(p.id)&&els.has(q.id))h+='<path d="'+pth(p,q)+'" stroke="'+(PAL[p.c||0].line||'#b0b0b6')+'"/>'});
 ns.forEach(n=>{const q=box(n),p=PAL[n.c||0];h+='<rect x="'+(q.cx-q.w/2)+'" y="'+(q.cy-q.h/2)+'" width="'+q.w+'" height="'+q.h+'" rx="12" fill="'+(n.img?'#e5e5ea':p.bg||'#fff')+'" stroke="#d2d2d7"/>'});
 S.strokes.slice(0,80).forEach(s=>{s.pts.forEach(q=>{a=Math.min(a,q[0]);b=Math.min(b,q[1]);c=Math.max(c,q[0]);d=Math.max(d,q[1])});h+='<path d="'+sp(s.pts)+'" stroke="'+inkCol(s.c,1)+'" stroke-linecap="round" style="stroke-width:'+s.w+'"/>'});
 const m=40;return'<svg viewBox="'+[a-m,b-m,c-a+2*m,d-b+2*m].join(' ')+'" xmlns="http://www.w3.org/2000/svg"><g style="fill:none;stroke-width:2.5">'+h+'</g></svg>'}

 const nb=document.createElement('button');nb.className='card new';nb.innerHTML='<div class="cv"><span>+</span></div><b>Nova mapa</b>';nb.onclick=newBoard;g.appendChild(nb);
 meta.boards.slice().sort((x,y)=>y.t-x.t).forEach(m=>{const c=document.createElement('div');c.className='card';c.tabIndex=0;

  c.querySelector('b').textContent=m.name;c.querySelector('small').textContent=new Date(m.t).toLocaleDateString('sr-Latn',{day:'numeric',month:'short',year:'numeric'});

function openBoard(id){flush();let j=null;try{j=JSON.parse(localStorage.getItem('mmb_'+id))}catch(e){}

 els.forEach(x=>x.remove());els.clear();S=j;S.edges=S.edges||[];S.view=S.view||{x:innerWidth/2,y:innerHeight/2,k:1};cur=id;sel=null;selEdge=null;ms=new Set();crop=null;editing=null;
 S.strokes=S.strokes||[];inkN=0;gsig='';undoP=null;S.nodes.forEach(el);view();ui();drawInk();document.body.classList.remove('ishome');$('#nm').value=meta.boards.find(b=>b.id===id).name;if(location.hash!=='#b-'+id)location.hash='b-'+id}

 const num=v=>/%/.test(v||'')?0:parseFloat(v)||0,vb=(r.getAttribute('viewBox')||'').trim().split(/[\s,]+/).map(Number);let w=num(r.getAttribute('width')),h=num(r.getAttribute('height'));

function loadPdfJs(){return window.pdfjsLib?Promise.resolve():new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';s.onload=ok;s.onerror=no;document.head.appendChild(s)})}

function addFile(f,i,p){const n=f.name||'',t=f.type;
 if(t==='image/svg+xml'||/\.svg$/i.test(n))f.text().then(s=>{if(!addSvg(s,p,i))toast('SVG se ne može učitati.')});
 else if(t==='application/pdf'||/\.(pdf|ai)$/i.test(n))addPdf(f,p,i);
 else if(t.startsWith('image/'))addImg(f,i,p)}

 else if((ev.key==='v'||ev.key==='V')&&!ev.metaKey&&!ev.ctrlKey)setTool('select');else if((ev.key==='h'||ev.key==='H')&&!ev.metaKey&&!ev.ctrlKey)setTool('hand');else if((ev.key==='g'||ev.key==='G')&&!ev.metaKey&&!ev.ctrlKey)toggleGal();else if((ev.key==='p'||ev.key==='P')&&!ev.metaKey&&!ev.ctrlKey)setTool('pen');else if((ev.key==='e'||ev.key==='E')&&!ev.metaKey&&!ev.ctrlKey)setTool('eraser');else if((ev.key==='z'||ev.key==='Z')&&(ev.metaKey||ev.ctrlKey)){ev.preventDefault();undoLay()}});

addEventListener('paste',ev=>{const cd=ev.clipboardData;if(!cd||!cur||ev.target.tagName==='INPUT')return;ev.preventDefault();
 if(editing){document.execCommand('insertText',false,cd.getData('text/plain'));return}
 const fs=[...cd.files].filter(f=>f.type.startsWith('image/')||f.type==='application/pdf'||/\.(svg|pdf|ai)$/i.test(f.name)),p=toW(mouse.x||innerWidth/2,mouse.y||innerHeight/2);
 if(fs.length){fs.forEach((f,i)=>addFile(f,i,p));return}
 const t=cd.getData('text/plain').trim(),h=cd.getData('text/html'),m=h.match(/<svg[\s\S]*<\/svg>/i);
 if(/^(<\?xml[\s\S]*?\?>\s*)?(<!--[\s\S]*?-->\s*)*<svg[\s>]/i.test(t)){if(addSvg(t,p))return}
 else if(m&&!t&&addSvg(m[0],p))return;
 if(t)select(addNode({x:p.x,y:p.y,text:t,c:0}).id);else toast('Ne mogu da pročitam clipboard ('+([...cd.types].join(', ')||'prazan')+'). Iz Illustratora probaj izvoz u SVG ili PNG i prevuci fajl ovde.')});

 els.forEach(x=>x.remove());els.clear();S=j;S.view=S.view||{x:innerWidth/2,y:innerHeight/2,k:1};S.strokes=S.strokes||[];sel=selEdge=null;ms=new Set();drawInk();S.nodes.forEach(el);view();ui();save()}catch(x){toast('Fajl nije ispravna mapa.')}};
