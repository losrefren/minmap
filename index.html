const PAL=[{},
{bg:'#ffe4e2',db:'#5a2b28',df:'#ffe9e7',line:'#ff3b30',fg:'#1d1d1f'},{bg:'#fff0d4',db:'#5a4120',df:'#fff1dc',line:'#ff9f0a',fg:'#1d1d1f'},
{bg:'#dcf5e3',db:'#27472f',df:'#e3f8e9',line:'#34c759',fg:'#1d1d1f'},{bg:'#dbeaff',db:'#243f63',df:'#e3efff',line:'#0a84ff',fg:'#1d1d1f'},
{bg:'#f0e2fb',db:'#43305e',df:'#f3e8fd',line:'#af52de',fg:'#1d1d1f'},{bg:'#1d1d1f',db:'#f5f5f7',df:'#1d1d1f',line:'#1d1d1f',fg:'#fff'},{bg:'#fff3a3',db:'#5e5012',df:'#fff7cf',line:'#e6b800',fg:'#1d1d1f'}];
let S={nodes:[],edges:[],view:{x:0,y:0,k:1}},sel=null,ms=new Set(),tool='hand',gsig='',galOpen=false,meta={boards:[]},cur=null,selEdge=null,editing=null,crop=null,D=null,mouse={x:0,y:0};
const els=new Map(),cl=(v,a,b)=>Math.max(a,Math.min(b,v)),uid=()=>'n'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const nodeOf=id=>S.nodes.find(n=>n.id===id);

function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2600)}
let st;function flush(){clearTimeout(st);if(!cur)return;try{localStorage.setItem('mmb_'+cur,JSON.stringify(S));const m=meta.boards.find(b=>b.id===cur);if(m){m.t=Date.now();m.pv=preview()}localStorage.setItem('mm2',JSON.stringify(meta))}catch(e){toast('Mapa je prevelika za automatsko čuvanje. Izvezi je.')}}

 if(!Array.isArray(meta.boards))meta={boards:[]};
 try{const old=localStorage.getItem('mm1');if(old&&!meta.boards.length){const id=uid();localStorage.setItem('mmb_'+id,old);meta.boards.push({id,name:'Moja mapa',t:Date.now(),pv:''});localStorage.setItem('mm2',JSON.stringify(meta));localStorage.removeItem('mm1')}}catch(e){}}
function preview(){const ns=S.nodes.slice(0,60).filter(n=>els.has(n.id));if(!ns.length)return'';let a=1e9,b=1e9,c=-1e9,d=-1e9,h='';
 ns.forEach(n=>{const q=box(n);a=Math.min(a,q.cx-q.w/2);b=Math.min(b,q.cy-q.h/2);c=Math.max(c,q.cx+q.w/2);d=Math.max(d,q.cy+q.h/2)});
 S.edges.forEach(g=>{const p=nodeOf(g.a),q=nodeOf(g.b);if(p&&q&&els.has(p.id)&&els.has(q.id))h+='<path d="'+pth(p,q)+'" stroke="'+(PAL[p.c||0].line||'#b0b0b6')+'"/>'});
 ns.forEach(n=>{const q=box(n),p=PAL[n.c||0];h+='<rect x="'+(q.cx-q.w/2)+'" y="'+(q.cy-q.h/2)+'" width="'+q.w+'" height="'+q.h+'" rx="12" fill="'+(n.img?'#e5e5ea':p.bg||'#fff')+'" stroke="#d2d2d7"/>'});
 S.strokes.slice(0,80).forEach(s=>{s.pts.forEach(q=>{a=Math.min(a,q[0]);b=Math.min(b,q[1]);c=Math.max(c,q[0]);d=Math.max(d,q[1])});h+='<path d="'+sp(s.pts)+'" stroke="'+inkCol(s.c,1)+'" stroke-linecap="round" style="stroke-width:'+s.w+'"/>'});
 const m=40;return'<svg viewBox="'+[a-m,b-m,c-a+2*m,d-b+2*m].join(' ')+'" xmlns="http://www.w3.org/2000/svg"><g style="fill:none;stroke-width:2.5">'+h+'</g></svg>'}
function home(){const g=$('#grid');g.innerHTML='';
 const nb=document.createElement('button');nb.className='card new';nb.innerHTML='<div class="cv"><span>+</span></div><b>Nova mapa</b>';nb.onclick=newBoard;g.appendChild(nb);
 meta.boards.slice().sort((x,y)=>y.t-x.t).forEach(m=>{const c=document.createElement('div');c.className='card';c.tabIndex=0;
  c.innerHTML='<div class="cv">'+(m.pv||'')+'</div><b></b><small></small><button class="x" title="Obriši mapu">×</button>';
  c.querySelector('b').textContent=m.name;c.querySelector('small').textContent=new Date(m.t).toLocaleDateString('sr-Latn',{day:'numeric',month:'short',year:'numeric'});
  c.onclick=()=>openBoard(m.id);c.onkeydown=e=>{if(e.key==='Enter')openBoard(m.id)};
  const x=c.querySelector('.x');x.onclick=e=>{e.stopPropagation();if(x.dataset.a)delBoard(m.id);else{x.dataset.a=1;x.textContent='Obriši?';x.classList.add('on');setTimeout(()=>{x.dataset.a='';x.textContent='×';x.classList.remove('on')},2500)}};
  g.appendChild(c)})}

 const cb=e.querySelector('.cropbox');if(cb)cb.remove();crop=null;ui()}

stage.addEventListener('pointerdown',ev=>{mouse={x:ev.clientX,y:ev.clientY};const t=ev.target;

    up:e=>{$('#tmp').remove();const o=document.elementFromPoint(e.clientX,e.clientY),to=o&&o.closest('.node');
     if(to&&to.dataset.id!==n.id){link(n.id,to.dataset.id);drawEdges();save()}
     else if(!to){const p=toW(e.clientX,e.clientY),m=addNode({x:p.x,y:p.y-18,text:'',c:n.c||0});link(n.id,m.id);drawEdges();startEdit(m.id)}}}}
  else if(t.classList.contains('hs')){const w0=n.w,x0=ev.clientX;D={mv:e=>{n.w=Math.max(60,w0+(e.clientX-x0)/S.view.k);el(n);drawEdges()},up:save}}
  else{const x0=ev.clientX,y0=ev.clientY,st=[...ms].map(id=>nodeOf(id)).filter(Boolean).map(m=>[m,m.x,m.y]);D={mv:e=>{const dx=(e.clientX-x0)/S.view.k,dy=(e.clientY-y0)/S.view.k;st.forEach(([m,px,py])=>{m.x=px+dx;m.y=py+dy;el(m)});drawEdges()},up:save}}
  return}
 if(tool==='select'||ev.shiftKey){const x0=ev.clientX,y0=ev.clientY,base=ev.shiftKey?new Set(ms):new Set();if(!ev.shiftKey)select(null);stage.setPointerCapture(ev.pointerId);const m=$('#mq');m.style.display='block';
  D={mv:e=>{const l=Math.min(x0,e.clientX),tp=Math.min(y0,e.clientY),w=Math.abs(e.clientX-x0),h=Math.abs(e.clientY-y0);Object.assign(m.style,{left:l+'px',top:tp+'px',width:w+'px',height:h+'px'});
   ms=new Set(base);els.forEach((q,id)=>{const r=q.getBoundingClientRect();if(r.right>l&&r.left<l+w&&r.bottom>tp&&r.top<tp+h)ms.add(id)});sel=null;ui()},up:()=>{m.style.display='none'}};return}
 select(null);stage.setPointerCapture(ev.pointerId);stage.classList.add('pan');
 const x0=ev.clientX,y0=ev.clientY,vx=S.view.x,vy=S.view.y;D={mv:e=>{S.view.x=vx+e.clientX-x0;S.view.y=vy+e.clientY-y0;view()},up:()=>{stage.classList.remove('pan');save()}}});

const end=ev=>{if(D){const d=D;D=null;d.up(ev)}};stage.addEventListener('pointerup',end);stage.addEventListener('pointercancel',end);

 if(ne){const n=nodeOf(ne.dataset.id);if(n.img)startCrop();else startEdit(n.id);return}

addEventListener('keydown',ev=>{if(ev.target.tagName==='INPUT')return;
 if(editing){if(ev.key==='Escape'||(ev.key==='Enter'&&(nodeOf(editing.id).sticky?(ev.metaKey||ev.ctrlKey):!ev.shiftKey))){ev.preventDefault();endEdit()}
  else if(ev.key==='Tab'){ev.preventDefault();const id=editing.id;endEdit();if(nodeOf(id))addChild(id)}return}
 if(crop){if(ev.key==='Enter')endCrop(true);else if(ev.key==='Escape')endCrop(false);return}
 if(ev.key==='Delete'||ev.key==='Backspace'){ev.preventDefault();delSel()}
 else if(ev.key==='Tab'&&sel){ev.preventDefault();addChild(sel)}
 else if(ev.key==='Enter'&&sel){const n=nodeOf(sel);if(!n.img)startEdit(sel)}
 else if((ev.key==='c'||ev.key==='C')&&!ev.metaKey&&!ev.ctrlKey)startCrop();
 else if(ev.key==='Escape')select(null);
 else if((ev.key==='a'||ev.key==='A')&&(ev.metaKey||ev.ctrlKey)){ev.preventDefault();ms=new Set(S.nodes.map(n=>n.id));sel=null;ui()}
 else if((ev.key==='v'||ev.key==='V')&&!ev.metaKey&&!ev.ctrlKey)setTool('select');else if((ev.key==='h'||ev.key==='H')&&!ev.metaKey&&!ev.ctrlKey)setTool('hand');else if((ev.key==='g'||ev.key==='G')&&!ev.metaKey&&!ev.ctrlKey)toggleGal();else if((ev.key==='p'||ev.key==='P')&&!ev.metaKey&&!ev.ctrlKey)setTool('pen');else if((ev.key==='e'||ev.key==='E')&&!ev.metaKey&&!ev.ctrlKey)setTool('eraser');else if((ev.key==='z'||ev.key==='Z')&&(ev.metaKey||ev.ctrlKey)){ev.preventDefault();undoLay()}});

 if(/^(<\?xml[\s\S]*?\?>\s*)?(<!--[\s\S]*?-->\s*)*<svg[\s>]/i.test(t)){if(addSvg(t,p))return}
 else if(m&&!t&&addSvg(m[0],p))return;
 if(t)select(addNode({x:p.x,y:p.y,text:t,c:0}).id);else toast('Ne mogu da pročitam clipboard ('+([...cd.types].join(', ')||'prazan')+'). Iz Illustratora probaj izvoz u SVG ili PNG i prevuci fajl ovde.')});
